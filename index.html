<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungle Trail — Full Sentence or Only a Piece?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0E2A18;
    --canopy:#17502F;
    --leaf:#3F8F3A;
    --lime:#A6D65B;
    --sun:#FFC93C;
    --bark:#6B4226;
    --parchment:#FFF8E7;
    --ink:#233020;
    --coral:#E8654A;
    --card-radius:26px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
    color:var(--parchment);
    background:
      radial-gradient(900px 600px at 15% 0%, #1E6B3C 0%, transparent 60%),
      radial-gradient(800px 700px at 90% 100%, #14472A 0%, transparent 65%),
      var(--night);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 16px 40px;
  }
  .leaves{position:fixed;inset:0;pointer-events:none;opacity:.16;z-index:0;}
  .leaves svg{width:100%;height:100%;}

  .wrap{position:relative;z-index:1;width:100%;max-width:760px;}

  header{text-align:center;margin-bottom:14px;}
  h1{
    font-size:clamp(26px,5vw,40px);
    font-weight:800;
    margin:0 0 4px;
    color:var(--sun);
    letter-spacing:.4px;
    text-shadow:0 3px 0 rgba(0,0,0,.35);
  }
  .sub{margin:0;font-size:clamp(15px,2.6vw,18px);color:#D8EFC4;font-weight:500;}

  /* ---- vine progress ---- */
  .vine{
    position:relative;
    display:flex;justify-content:space-between;align-items:center;
    margin:18px 6px 20px;
  }
  .vine::before{
    content:"";position:absolute;left:4px;right:4px;top:50%;height:6px;
    transform:translateY(-50%);
    background:var(--bark);border-radius:99px;opacity:.85;
  }
  .stone{
    position:relative;width:30px;height:30px;border-radius:50%;
    background:#0B2113;border:3px solid var(--bark);
    display:grid;place-items:center;font-size:14px;font-weight:700;color:#7FA88B;
    transition:transform .25s ease, background .25s ease, border-color .25s ease;
  }
  .stone.done{background:var(--lime);border-color:#EAF7D2;color:#1B4320;}
  .stone.now{background:var(--sun);border-color:#FFF3C4;color:#5A3B00;transform:scale(1.25);}

  /* ---- card ---- */
  .card{
    background:var(--parchment);
    color:var(--ink);
    border-radius:var(--card-radius);
    padding:26px 22px 24px;
    box-shadow:0 18px 0 -6px rgba(0,0,0,.28), 0 0 0 5px var(--lime);
    transition:opacity .32s ease;
  }
  .card.fading{opacity:0;}
  .step-label{
    margin:0 0 14px;font-size:15px;font-weight:700;color:var(--leaf);
  }
  .sentence{
    background:#fff;
    border:3px dashed var(--lime);
    border-radius:18px;
    padding:20px 18px;
    font-size:clamp(22px,4.4vw,30px);
    font-weight:700;
    text-align:center;
    margin:0 0 20px;
    line-height:1.35;
  }

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  button{font-family:inherit;cursor:pointer;}
  .big{
    border:none;border-radius:18px;padding:16px 12px;
    font-size:clamp(17px,3.2vw,21px);font-weight:700;color:#fff;
    box-shadow:0 6px 0 rgba(0,0,0,.25);
    transition:transform .12s ease;
  }
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .big.full{background:var(--leaf);}
  .big.piece{background:var(--coral);}
  .big:focus-visible,.tile:focus-visible,.link:focus-visible,.slot:focus-visible,input:focus-visible{
    outline:4px solid var(--sun);outline-offset:3px;
  }

  /* ---- rebuild ---- */
  .build-row{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    background:#fff;border:3px solid var(--lime);border-radius:18px;
    padding:14px;margin-bottom:16px;
  }
  .slot{
    min-width:170px;min-height:56px;
    border:3px dashed #B9CBA6;border-radius:14px;
    display:grid;place-items:center;padding:8px 14px;
    font-size:clamp(17px,3.2vw,22px);font-weight:700;color:#93A889;
    background:#F7FBF1;
  }
  .slot.over{border-color:var(--sun);background:#FFF6DC;}
  .slot.filled{border-style:solid;border-color:var(--leaf);color:var(--ink);background:#EDF7E2;cursor:pointer;}
  .rest{
    flex:1 1 200px;min-width:180px;
    font-family:inherit;font-size:clamp(17px,3.2vw,22px);font-weight:600;
    padding:12px 14px;border:3px solid #DCE6D0;border-radius:14px;color:var(--ink);
    background:#fff;
  }
  .bank-title{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--leaf);}
  .bank{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .tile{
    background:var(--sun);border:none;border-radius:14px;
    padding:12px 16px;font-size:clamp(16px,3vw,20px);font-weight:700;color:#4A3200;
    box-shadow:0 5px 0 rgba(0,0,0,.22);
    transition:transform .12s ease;
  }
  .tile.picked{background:#FFE9A3;transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22);}
  .tile.used{visibility:hidden;}
  .actions{display:flex;flex-wrap:wrap;gap:10px;}
  .link{
    background:none;border:3px solid #CFDCC2;border-radius:14px;
    padding:12px 16px;font-size:16px;font-weight:700;color:var(--leaf);
  }
  .grow{flex:1 1 auto;}

  .feedback{
    margin-top:16px;padding:14px 16px;border-radius:16px;
    font-size:clamp(16px,3vw,20px);font-weight:700;min-height:0;
  }
  .feedback:empty{display:none;}
  .feedback.good{background:#E4F6D5;color:#1F5E24;border:3px solid var(--leaf);}
  .feedback.try{background:#FFF0D8;color:#8A5200;border:3px solid var(--sun);}

  /* ---- modal ---- */
  .veil{
    position:fixed;inset:0;background:rgba(6,22,13,.72);
    display:none;place-items:center;padding:20px;z-index:5;
  }
  .veil.open{display:grid;}
  .modal{
    background:var(--parchment);color:var(--ink);border-radius:24px;
    padding:26px 24px;max-width:460px;width:100%;
    box-shadow:0 0 0 5px var(--sun);
  }
  .modal h2{margin:0 0 12px;font-size:24px;color:var(--leaf);}
  .modal ul{margin:0 0 18px;padding-left:22px;font-size:18px;line-height:1.7;font-weight:600;}
  .modal p{font-size:18px;font-weight:600;line-height:1.5;margin:0 0 18px;}

  .finish{text-align:center;}
  .finish .score{font-size:clamp(30px,6vw,44px);font-weight:800;color:var(--leaf);margin:6px 0 4px;}
  .finish p{font-size:19px;font-weight:600;}

  @media (max-width:520px){
    .choices{grid-template-columns:1fr;}
    .slot{min-width:100%;}
    .stone{width:24px;height:24px;font-size:12px;border-width:2px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="leaves" aria-hidden="true">
  <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
    <g fill="#A6D65B">
      <path d="M40 0c60 50 70 140 10 190C-10 150-10 50 40 0z"/>
      <path d="M760 40c-70 40-90 130-30 190 60-40 70-140 30-190z"/>
      <path d="M120 560c50-60 140-70 190-10-50 50-150 50-190 10z"/>
      <path d="M700 520c-60 20-100 90-70 150 60-20 90-100 70-150z"/>
      <path d="M380 -20c40 60 30 140-20 180-40-60-30-140 20-180z"/>
    </g>
  </svg>
</div>

<div class="wrap">
  <header>
    <h1>Jungle Trail</h1>
    <p class="sub">Full sentence, or only a piece?</p>
  </header>

  <nav class="vine" id="vine" aria-label="Your progress"></nav>

  <main class="card" id="card" aria-live="polite"></main>
</div>

<div class="veil" id="veil">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <h2 id="mtitle">My sentence checklist</h2>
    <ul>
      <li>Capital letter at the start</li>
      <li>A naming part — who or what</li>
      <li>A doing part — the action</li>
      <li>Full stop at the end</li>
    </ul>
    <p>Drag a yellow tile into the box, then type the rest.</p>
    <button class="big full" id="closeModal" style="width:100%">Back to the trail</button>
  </div>
</div>

<script>
const VERBS = ("is are am was were has have had run ran runs walk walks walked eat eats ate "+
"drink drinks drank play plays played read reads sleep sleeps slept sit sits sat go goes went "+
"come comes came see sees saw like likes liked live lives lived make makes made take takes "+
"help helps helped want wants wanted jump jumps jumped swim swims climb climbs sing sings "+
"write writes wrote work works worked").split(" ");

const ITEMS = [
  { text:"My sister is reading a book.", full:true },

  { text:"Ran to the bus stop.", full:false,
    why:"There is no naming part. Who ran?",
    tiles:["My brother","The children","I","Bus"],
    need:["ran"],
    hint:"Start with a person, then say what they did." },

  { text:"The rain very heavy.", full:false,
    why:"There is no doing or being word.",
    tiles:["The rain was","The rain is","The rain","Rain"],
    need:["heavy"],
    hint:"You need a being word like was." },

  { text:"We eat rice every day.", full:true },

  { text:"In the classroom.", full:false,
    why:"This is only a place. It has no naming part and no doing part.",
    tiles:["We are","The students are","My teacher is","Classroom"],
    need:["classroom"],
    hint:"Say who is there first." },

  { text:"Is very hot today.", full:false,
    why:"There is no naming part. What is hot?",
    tiles:["It","The weather","Today","Hot"],
    need:["hot"],
    hint:"Start with It or The weather." },

  { text:"My friends playing football.", full:false,
    why:"A small word is missing before playing.",
    tiles:["My friends are","They are","My friends","Friends"],
    need:["playing"],
    hint:"My friends ___ playing football." },

  { text:"The dog is sleeping under the chair.", full:true },

  { text:"I went to the market with my mother.", full:true },

  { text:"A big brown monkey.", full:false,
    why:"We know what it is, but not what it does.",
    tiles:["A big brown monkey is","A big brown monkey","The monkey","Monkey"],
    need:[],
    hint:"What is the monkey doing? Try eating, climbing or sleeping." }
];

let i = 0, stage = "judge", picked = null, slotText = "", firstTry = true, clean = 0;

const card = document.getElementById("card");
const vine = document.getElementById("vine");
const veil = document.getElementById("veil");

document.getElementById("closeModal").onclick = () => veil.classList.remove("open");
veil.addEventListener("click", e => { if (e.target === veil) veil.classList.remove("open"); });

function drawVine(){
  vine.innerHTML = ITEMS.map((_, n) =>
    `<span class="stone ${n < i ? "done" : ""} ${n === i ? "now" : ""}">${n < i ? "✓" : n+1}</span>`
  ).join("");
}

function swap(html){
  card.classList.add("fading");
  setTimeout(() => {
    card.innerHTML = html;
    card.classList.remove("fading");
    drawVine();
  }, 320);
}

function helpBtn(){
  return `<button class="link" id="help">Need help?</button>`;
}
function wireHelp(){
  const h = document.getElementById("help");
  if (h) h.onclick = () => veil.classList.add("open");
}

/* ---------- stage 1: judge ---------- */
function renderJudge(){
  stage = "judge"; firstTry = true; picked = null; slotText = "";
  swap(`
    <p class="step-label">Stop ${i+1} of ${ITEMS.length}</p>
    <p class="sentence">${ITEMS[i].text}</p>
    <div class="choices">
      <button class="big full" data-pick="full">Full sentence</button>
      <button class="big piece" data-pick="piece">Only a piece</button>
    </div>
    <div class="feedback" id="fb"></div>
    <div class="actions" style="margin-top:14px">${helpBtn()}</div>
  `);
  setTimeout(() => {
    card.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => judge(b.dataset.pick));
    wireHelp();
  }, 330);
}

function judge(choice){
  const item = ITEMS[i];
  const right = (choice === "full") === item.full;
  const fb = document.getElementById("fb");
  if (!right){
    firstTry = false;
    fb.className = "feedback try";
    fb.textContent = item.full
      ? "Look again. It has a naming part and a doing part. Try the other button."
      : "Look again. Something is missing. Read it out loud.";
    return;
  }
  if (item.full){
    if (firstTry) clean++;
    fb.className = "feedback good";
    fb.textContent = "Yes! It has everything. Onward.";
    setTimeout(next, 1100);
  } else {
    fb.className = "feedback good";
    fb.textContent = "Correct — " + item.why;
    setTimeout(renderBuild, 1100);
  }
}

/* ---------- stage 2: rebuild ---------- */
function renderBuild(){
  stage = "build";
  const item = ITEMS[i];
  swap(`
    <p class="step-label">Stop ${i+1} — now make it whole</p>
    <p class="sentence" style="font-size:20px;border-style:solid;border-color:#E6D9B8">${item.text}</p>
    <div class="build-row">
      <div class="slot" id="slot" tabindex="0" role="button" aria-label="Drop a starter tile here">drop a tile here</div>
      <input class="rest" id="rest" placeholder="type the rest…" autocomplete="off" spellcheck="false">
    </div>
    <p class="bank-title">Starter tiles</p>
    <div class="bank" id="bank">
      ${item.tiles.map((t,n) => `<button class="tile" draggable="true" data-t="${n}">${t}</button>`).join("")}
    </div>
    <div class="actions">
      <button class="big full grow" id="check">Check my sentence</button>
      ${helpBtn()}
    </div>
    <div class="feedback" id="fb"></div>
  `);
  setTimeout(wireBuild, 330);
}

function wireBuild(){
  const slot = document.getElementById("slot");
  const bank = document.getElementById("bank");
  const rest = document.getElementById("rest");

  bank.querySelectorAll(".tile").forEach(tile => {
    tile.addEventListener("dragstart", e => {
      picked = tile;
      e.dataTransfer.setData("text/plain", tile.textContent);
    });
    tile.onclick = () => {
      bank.querySelectorAll(".tile").forEach(t => t.classList.remove("picked"));
      tile.classList.add("picked");
      picked = tile;
      place(tile);
    };
  });

  slot.addEventListener("dragover", e => { e.preventDefault(); slot.classList.add("over"); });
  slot.addEventListener("dragleave", () => slot.classList.remove("over"));
  slot.addEventListener("drop", e => {
    e.preventDefault(); slot.classList.remove("over");
    if (picked) place(picked);
  });
  slot.onclick = () => { if (slotText) clearSlot(); };
  slot.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && slotText){ e.preventDefault(); clearSlot(); } };

  document.getElementById("check").onclick = check;
  rest.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  wireHelp();
}

function place(tile){
  const slot = document.getElementById("slot");
  document.querySelectorAll(".tile").forEach(t => t.classList.remove("used","picked"));
  tile.classList.add("used");
  slotText = tile.textContent;
  slot.textContent = slotText;
  slot.classList.add("filled");
  document.getElementById("rest").focus();
}

function clearSlot(){
  const slot = document.getElementById("slot");
  slotText = "";
  slot.textContent = "drop a tile here";
  slot.classList.remove("filled");
  document.querySelectorAll(".tile").forEach(t => t.classList.remove("used","picked"));
}

function hasVerb(words){
  return words.some(w => VERBS.includes(w) || (w.length > 4 && w.endsWith("ing")));
}

function check(){
  const item = ITEMS[i];
  const rest = document.getElementById("rest").value.trim();
  const fb = document.getElementById("fb");
  const nudge = msg => { firstTry = false; fb.className = "feedback try"; fb.textContent = msg; };

  if (!slotText) return nudge("Drag a yellow tile into the box first.");
  if (!rest) return nudge("Now type the rest of your sentence.");

  const full = (slotText + " " + rest).replace(/\s+/g," ").trim();
  const words = full.toLowerCase().replace(/[.!?,]/g,"").split(" ");

  const missing = item.need.filter(w => !words.includes(w));
  if (missing.length) return nudge(`Keep the word “${missing[0]}” in your sentence.`);
  if (!hasVerb(words)) return nudge("Your sentence needs a doing or being word. " + item.hint);
  if (words.length < 3) return nudge("Add a little more. " + item.hint);
  if (!/[.!?]$/.test(full)) return nudge("Almost! Put a full stop at the end.");

  if (firstTry) clean++;
  fb.className = "feedback good";
  fb.innerHTML = `Whole sentence! <span style="display:block;font-weight:800;margin-top:6px">${full}</span>`;
  setTimeout(next, 1600);
}

/* ---------- flow ---------- */
function next(){
  i++;
  if (i < ITEMS.length) renderJudge(); else renderEnd();
}

function renderEnd(){
  drawVine();
  swap(`
    <div class="finish">
      <p class="step-label">Trail complete</p>
      <p style="font-size:44px;margin:0">🌴</p>
      <p class="score">${clean} / ${ITEMS.length} first try</p>
      <p>Every stop was fixed. That is what counts.</p>
      <button class="big full" id="again" style="width:100%;margin-top:10px">Walk the trail again</button>
    </div>
  `);
  setTimeout(() => {
    document.getElementById("again").onclick = () => { i = 0; clean = 0; renderJudge(); };
  }, 330);
}

renderJudge();
drawVine();
</script>
</body>
</html>
